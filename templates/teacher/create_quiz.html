{% extends "base.html" %}

{% block title %}Create Quiz{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}

{% block content %}
<div class="create-quiz-container">
    <h2>Create New Quiz</h2>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    
    <form id="quiz-form" method="POST">
        <div class="form-group">
            <label for="title">Quiz Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description"></textarea>
        </div>
        
        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                {% for category in categories %}
                    <option value="{{ category.CategoryID }}">{{ category.Name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="start_time">Start Time:</label>
                <input type="datetime-local" id="start_time" name="start_time" required>
            </div>
            
            <div class="form-group">
                <label for="end_time">End Time:</label>
                <input type="datetime-local" id="end_time" name="end_time" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="passing_score">Passing Score (%):</label>
            <input type="number" id="passing_score" name="passing_score" min="0" max="100" value="50" required>
        </div>
        
        <h3>Questions</h3>
        <div id="questions-container">
            <!-- Questions will be added here dynamically -->
        </div>
        
        <input type="hidden" id="question_count" name="question_count" value="0">
        
        <button type="button" id="add-question" class="btn">Add Question</button>
        <button type="submit" class="btn primary">Create Quiz</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    initQuizCreator();
});
</script>
{% endblock %}
